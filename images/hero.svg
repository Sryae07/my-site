<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Learning HTML</title>
  <desc id="heroDesc">A browser window drawn as a thin outline on warm paper, with the words Learning HTML and three lines of placeholder text inside it.</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfaf5"/>
      <stop offset="1" stop-color="#f3ede3"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7fbfa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#paper)"/>

  <!-- soft background shapes -->
  <circle cx="1050" cy="90" r="150" fill="#0f766e" opacity="0.06"/>
  <circle cx="120" cy="560" r="190" fill="#0f766e" opacity="0.05"/>

  <!-- browser window -->
  <g transform="translate(170 120)">
    <rect x="0" y="0" width="860" height="390" rx="18" fill="url(#screen)"
          stroke="#0f766e" stroke-width="3" stroke-opacity="0.55"/>
    <!-- title bar -->
    <path d="M0 46 H860" stroke="#0f766e" stroke-width="3" stroke-opacity="0.35"/>
    <circle cx="34" cy="23" r="8" fill="#0f766e" opacity="0.55"/>
    <circle cx="60" cy="23" r="8" fill="#0f766e" opacity="0.35"/>
    <circle cx="86" cy="23" r="8" fill="#0f766e" opacity="0.2"/>

    <!-- page content -->
    <text x="46" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="58" font-weight="700" fill="#12352f">Learning HTML</text>

    <rect x="46" y="176" width="470" height="14" rx="7" fill="#0f766e" opacity="0.18"/>
    <rect x="46" y="206" width="392" height="14" rx="7" fill="#0f766e" opacity="0.14"/>
    <rect x="46" y="236" width="430" height="14" rx="7" fill="#0f766e" opacity="0.10"/>

    <!-- three cards -->
    <g>
      <rect x="46" y="284" width="220" height="76" rx="12" fill="#0f766e" opacity="0.09"/>
      <rect x="60" y="300" width="96" height="10" rx="5" fill="#0f766e" opacity="0.35"/>
      <rect x="60" y="322" width="170" height="8" rx="4" fill="#0f766e" opacity="0.18"/>
    </g>
    <g>
      <rect x="290" y="284" width="220" height="76" rx="12" fill="#0f766e" opacity="0.09"/>
      <rect x="304" y="300" width="76" height="10" rx="5" fill="#0f766e" opacity="0.35"/>
      <rect x="304" y="322" width="150" height="8" rx="4" fill="#0f766e" opacity="0.18"/>
    </g>
    <g>
      <rect x="534" y="284" width="220" height="76" rx="12" fill="#0f766e" opacity="0.09"/>
      <rect x="548" y="300" width="110" height="10" rx="5" fill="#0f766e" opacity="0.35"/>
      <rect x="548" y="322" width="160" height="8" rx="4" fill="#0f766e" opacity="0.18"/>
    </g>
  </g>

  <!-- the useless machine, small, bottom right -->
  <g transform="translate(880 470)">
    <rect x="0" y="0" width="180" height="96" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="3" stroke-opacity="0.35"/>
    <rect x="24" y="26" width="52" height="44" rx="10" fill="#0f766e" opacity="0.85"/>
    <circle cx="50" cy="48" r="11" fill="#fdfaf5"/>
    <rect x="96" y="34" width="58" height="10" rx="5" fill="#0f766e" opacity="0.25"/>
    <rect x="96" y="54" width="40" height="10" rx="5" fill="#0f766e" opacity="0.18"/>
  </g>

  <text x="170" y="576" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="26" fill="#0f766e" opacity="0.85">Web Technologies · Project 1</text>
</svg>
